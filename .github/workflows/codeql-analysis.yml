name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'java'

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 'java' is CodeQL's canonical identifier for the whole JVM family
        # ('java-kotlin' and 'kotlin' are aliases of it). It covers the 36 Java
        # sources in app/src/main/java, where every planted bug lives.
        # app/src/main/cpp/native-lib.cpp would additionally need language
        # 'c-cpp' plus the NDK/CMake build, and the Dart sources under
        # ostorlab_insecure_flutter_app/lib are not supported by CodeQL at all.
        # On manual runs the value comes from the workflow_dispatch input above;
        # on push/pull_request/schedule it falls back to 'java'.
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning#changing-the-languages-that-are-analyzed
        language: ${{ fromJSON(format('["{0}"]', github.event.inputs.languages || 'java')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 11, not 17: AGP 7.2.2 (build.gradle) and the Gradle that ships with
      # Flutter 3.7.12 both expect it, and it is what the other workflows in this
      # repo (release.yml, connectedAndroidTest.yml) already use.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'
          cache: true

      # ':app' declares debug/profile/releaseImplementation dependencies on
      # co.ostorlab.ostorlab_insecure_flutter_app:flutter_*:1.0, which only exist
      # once this command publishes them into
      # ostorlab_insecure_flutter_app/build/host/outputs/repo. Without this step
      # the compile below dies at ':app:checkDebugAarMetadata' with
      # "Could not find ...:flutter_debug:1.0" (reproduced locally).
      #
      # It runs *before* 'Initialize CodeQL' on purpose, so the Java/Kotlin
      # sources of the Flutter plugins are not traced into our database.
      - name: Build the Flutter module AAR
        working-directory: ostorlab_insecure_flutter_app
        run: |
          flutter pub get
          flutter build aar --no-sound-null-safety

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      # settings.gradle includes a single module, ':app', and it declares no
      # product flavors, so the task is ':app:compileDebugJavaWithJavac' (there
      # is no 'foss'/'gplay'/'general' flavor in this project).
      # Compiling only the Java sources keeps the CMake/NDK external native build
      # out of the task graph - verified with --dry-run: no externalNativeBuild
      # task is scheduled - which 'assembleDebug' would otherwise pull in.
      # '--no-daemon' keeps the compiler under the CodeQL tracer.
      - name: Compile the Java sources
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
